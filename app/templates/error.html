{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<div class="py-5">
  <p class="error-code">{{ code }}</p>
  <h1>{{ message }}</h1>
  <p class="muted">If you followed a link, it may be wrong or you may need a different account.</p>
  <a class="button" href="{{ url_for('home') }}">Go to the home page</a>
</div>
{% endblock %}
