{% extends "base.html" %}
{% block title %}Register a parcel{% endblock %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('parcels.my_parcels') }}">Back to my parcels</a>
<h1>Register a parcel</h1>
<p class="muted">You'll get a tracking number to share with the recipient.</p>
<div class="panel">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="recipient_name">Recipient name</label>
      <input class="input" id="recipient_name" name="recipient_name" maxlength="100" value="{{ form.get('recipient_name', '') }}" required>
    </div>
    <div class="field">
      <label for="recipient_phone">Recipient phone</label>
      <input class="input" id="recipient_phone" name="recipient_phone" maxlength="20" inputmode="tel" placeholder="012-3456789" value="{{ form.get('recipient_phone', '') }}" required>
    </div>
    <div class="field">
      <label for="recipient_address">Delivery address</label>
      <textarea class="textarea" id="recipient_address" name="recipient_address" maxlength="255" rows="3" required>{{ form.get('recipient_address', '') }}</textarea>
    </div>
    <div class="field">
      <label for="weight_kg">Weight (kg)</label>
      <input class="input" id="weight_kg" name="weight_kg" type="number" step="0.01" min="0.01" max="30" value="{{ form.get('weight_kg', '') }}" required aria-describedby="weight-hint">
      <p class="hint" id="weight-hint">Up to 30 kg.</p>
    </div>
    <button class="button button-block">Register parcel</button>
  </form>
</div>
{% endblock %}
