{% extends "base.html" %}
{% block title %}Register parcel{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Register a new parcel</h2>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Recipient name</label>
            <input name="recipient_name" class="form-control" maxlength="100" value="{{ form.get('recipient_name', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Recipient phone</label>
            <input name="recipient_phone" class="form-control" maxlength="20" placeholder="012-3456789" value="{{ form.get('recipient_phone', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Recipient address</label>
            <textarea name="recipient_address" class="form-control" maxlength="255" rows="3" required>{{ form.get('recipient_address', '') }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Weight (kg)</label>
            <input name="weight_kg" type="number" step="0.01" min="0.01" max="30" class="form-control" value="{{ form.get('weight_kg', '') }}" required>
          </div>
          <button class="btn btn-dark w-100">Register parcel</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
