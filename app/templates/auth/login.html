{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<h1>Log in</h1>
<p class="muted">For sellers, riders and RapidExpress admin.</p>
<div class="panel">
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email</label>
      <input class="input" type="email" id="email" name="email" maxlength="120" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" type="password" id="password" name="password" required>
    </div>
    <button class="button button-block">Log in</button>
  </form>
</div>
<p class="small muted mt-3">New seller? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
