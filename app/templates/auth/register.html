{% extends "base.html" %}
{% block title %}Seller registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Create a seller account</h2>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Shop or seller name</label>
            <input name="name" class="form-control" maxlength="100" value="{{ name or '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" maxlength="120" value="{{ email or '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" minlength="10" required>
            <div class="form-text">At least 10 characters. Don't reuse a password from another site.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm" class="form-control" minlength="10" required>
          </div>
          <button class="btn btn-dark w-100">Create account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
