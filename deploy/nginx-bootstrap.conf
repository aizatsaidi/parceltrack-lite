# Temporary HTTP-only bootstrap site. It serves ACME challenges but never proxies
# requests to ParcelTrack; replace it with nginx-parceltrack.conf after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name tracking.example.com;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
